name: Feature request
description: Suggest a new hook or an enhancement to an existing one
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the use case this feature would enable.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: >
        What would the hook's signature/usage look like? Feel free to sketch
        rough TypeScript.
      render: tsx
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other libraries that solve this.
    validations:
      required: false
