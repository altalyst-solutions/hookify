name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # deny-all default; jobs below grant only what they need

jobs:
  build-and-publish:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the "Version Packages" PR branch and release tags
      pull-requests: write # required for changesets/action to open/update the "Version Packages" PR
      id-token: write # required for npm trusted publishing (OIDC)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      # `true` when this run published @altalyst/hookify-mcp, so the MCP
      # Registry listing is updated below.
      mcp-published: ${{ contains(fromJSON(steps.changesets.outputs.publishedPackages || '[]').*.name, '@altalyst/hookify-mcp') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Run library tests
        run: pnpm test
        env:
          CI: true

      - name: Build library
        run: pnpm build

      - name: Verify npm supports trusted publishing
        uses: ./.github/actions/verify-npm

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # Ensure this only runs on push to main, never on manual dispatch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "ci: version packages"
          pr-title: "ci: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # authenticates pnpm publish via OIDC trusted publishing, no NPM_TOKEN needed

      # GitHub marks the newest release as "Latest", which after an MCP-only
      # release would be @altalyst/hookify-mcp. Keep the badge on the library,
      # the main package, like other per-package monorepos (changesets, Remix).
      - name: Keep the library as the latest GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select((.isDraft | not) and (.isPrerelease | not))
                       | select(.tagName | test("^(v|@altalyst/hookify@)[0-9]+\\.[0-9]+\\.[0-9]+$"))]
                  | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            echo "::warning::No @altalyst/hookify release found to mark as latest."
            exit 0
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          echo "Marked $tag as the latest release."

  # After a release is published, deploy its docs as the new stable channel.
  # (The release is created with GITHUB_TOKEN, which doesn't trigger other
  # workflows, so the docs workflow is called directly instead.)
  deploy-docs:
    needs: build-and-publish
    if: ${{ needs.build-and-publish.outputs.published == 'true' }}
    permissions:
      contents: write # attach the built stable docs to the release
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-deploy.yml

  # Lists each new @altalyst/hookify-mcp version on the MCP Registry.
  publish-mcp-registry:
    needs: build-and-publish
    if: ${{ needs.build-and-publish.outputs.mcp-published == 'true' }}
    permissions:
      contents: read
      id-token: write # the MCP Registry authenticates GitHub Actions with OIDC
    uses: ./.github/workflows/mcp-registry.yml

  publish-dry-run:
    # Manual-only job to verify the trusted publisher OIDC setup without publishing.
    # workflow_dispatch already requires write access to the repo to trigger.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'altalyst-solutions/hookify'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build library
        run: pnpm build

      - name: Verify npm supports trusted publishing
        uses: ./.github/actions/verify-npm

      - name: Publish to NPM (dry run)
        run: | # authenticates via OIDC trusted publishing, no token needed
          pnpm --dir packages/hookify publish --dry-run --no-git-checks
          pnpm --dir packages/hookify-mcp publish --dry-run --no-git-checks
