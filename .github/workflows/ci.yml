name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # deny-all default; jobs below grant only what they need

jobs:
  build-and-publish:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to push the "Version Packages" PR branch and release tags
      pull-requests: write # required for changesets/action to open/update the "Version Packages" PR
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Run library tests
        run: npm run test
        env:
          CI: true

      - name: Build library
        run: npm run build

      - name: Verify npm supports trusted publishing
        uses: ./.github/actions/verify-npm

      - name: Create Release Pull Request or Publish to npm
        # Ensure this only runs on push to main, never on manual dispatch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: changesets/action@v2
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: "ci: version packages"
          pr-title: "ci: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # authenticates npm publish via OIDC trusted publishing, no NPM_TOKEN needed

  publish-dry-run:
    # Manual-only job to verify the trusted publisher OIDC setup without publishing.
    # workflow_dispatch already requires write access to the repo to trigger.
    if: >
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'altalyst-solutions/hookify'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Build library
        run: npm run build

      - name: Verify npm supports trusted publishing
        uses: ./.github/actions/verify-npm

      - name: Publish to NPM (dry run)
        run: npm publish --dry-run # authenticates via OIDC trusted publishing, no token needed
