name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    if: >
      ${{ 
        github.repository == 'altalyst-solutions/hookify' && 
        !contains(github.event.head_commit.message, '[skip ci]') 
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm run setup

      - name: Run library tests
        run: npm run test
        env:
          CI: true

      - name: Build library
        run: npm run build

      - name: Update npm
        run: npm install -g npm@latest

      - name: Capture pre-bump version
        id: pre_bump
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bump version and push changes
        id: bump_version
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}
        with:
          minor-wording: "feat"
          major-wording: "BREAKING CHANGE"
          commit-message: "ci: bump version to {{version}} [skip ci]"

      - name: Generate changelog entry
        if: steps.bump_version.outputs.newTag != ''
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.newTag }}
          PREV_VERSION: ${{ steps.pre_bump.outputs.version }}
        run: node scripts/update-changelog.js

      - name: Commit and push changelog
        if: steps.bump_version.outputs.newTag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ steps.bump_version.outputs.newTag }} [skip ci]"
          git push "https://${{ github.actor }}:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Publish to NPM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Ensure this only runs on push to main, never on manual dispatch
        run: npm publish # authenticates via OIDC trusted publishing, no token needed

  publish-dry-run:
    # Manual-only job to verify the trusted publisher OIDC setup without publishing.
    # workflow_dispatch already requires write access to the repo to trigger.
    if: >
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'altalyst-solutions/hookify'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm run setup

      - name: Build library
        run: npm run build

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to NPM (dry run)
        run: npm publish --dry-run # authenticates via OIDC trusted publishing, no token needed
