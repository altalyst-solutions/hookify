name: Dependency Audit

# Scheduled so a newly published advisory turns this workflow red without
# blocking unrelated PRs or releases.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 09:00 GMT+4 (GitHub cron is always UTC)
  workflow_dispatch:

permissions: {} # deny-all default; jobs below grant only what they need

jobs:
  audit:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false # report both projects even if one fails
      matrix:
        include:
          - name: library
            directory: .
            level: moderate
          # docs-site is build-time only and not shipped, so only fail on high or critical.
          - name: docs-site
            directory: docs-site
            level: high

    name: audit (${{ matrix.name }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Test audit summary
        run: node --test .github/scripts/audit-summary.test.mjs

      # pnpm reads the lockfile without an install and filters JSON by audit level.
      # Collect every advisory; the summary applies the matrix failure threshold.
      - name: Collect pnpm audit results
        id: audit
        working-directory: ${{ matrix.directory }}
        env:
          AUDIT_JSON_PATH: ${{ runner.temp }}/audit-${{ matrix.name }}.json
          AUDIT_STDERR_PATH: ${{ runner.temp }}/audit-${{ matrix.name }}.stderr
        run: |
          set +e
          pnpm audit --json --audit-level=info \
            > "$AUDIT_JSON_PATH" 2> "$AUDIT_STDERR_PATH"
          audit_status=$?
          set -e
          printf 'exit_code=%s\n' "$audit_status" >> "$GITHUB_OUTPUT"

      - name: Write audit summary
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          AUDIT_JSON_PATH: ${{ runner.temp }}/audit-${{ matrix.name }}.json
          AUDIT_STDERR_PATH: ${{ runner.temp }}/audit-${{ matrix.name }}.stderr
          AUDIT_LEVEL: ${{ matrix.level }}
          AUDIT_NAME: ${{ matrix.name }}
          AUDIT_DIRECTORY: ${{ matrix.directory }}
        run: node .github/scripts/audit-summary.mjs >> "$GITHUB_STEP_SUMMARY"
