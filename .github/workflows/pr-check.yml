name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-check:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      # The MCP server bundles data built from the library, so a library
      # release must also release it (usually as a patch).
      - name: Check changesets
        run: pnpm changeset:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint library
        run: pnpm lint

      - name: Run library tests with coverage
        run: pnpm coverage
        env:
          CI: true

      - name: Write coverage summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build packages
        run: pnpm build

      - name: Check library bundles
        run: pnpm dist:check

      - name: Check packed packages
        run: pnpm check:package

      - name: Type-check MCP server
        run: pnpm -F @altalyst/hookify-mcp typecheck

      - name: Run MCP server tests
        run: pnpm test:mcp --run
        env:
          CI: true

  # @altalyst/hookify-mcp runs on users' machines and supports Node.js 22 (its
  # `engines`), while the repo's tooling uses Node 24. Build on 24, then run the
  # server's tests and its built command on the newest Node 22.
  mcp-node22:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build packages
        run: pnpm build

      - name: Switch to Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run MCP server tests on Node.js 22
        working-directory: packages/hookify-mcp
        run: |
          node --version
          pnpm exec vitest run
        env:
          CI: true

  # Installs the packed library into small consumer projects (Node ESM and
  # CommonJS, TypeScript with node16 and bundler resolution, a Vite build) to
  # catch packaging that only breaks for some kinds of consumer. Fixtures are
  # the folders in e2e/consumers, and each one gets its own job.
  consumer-fixtures:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.list.outputs.fixtures }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List consumer fixtures
        id: list
        run: |
          fixtures=$(find e2e/consumers -mindepth 2 -maxdepth 2 -name package.json -exec dirname {} \; | xargs -n1 basename | sort | jq -R . | jq -sc .)
          echo "fixtures=$fixtures" >> "$GITHUB_OUTPUT"

  consumer-test:
    needs: consumer-fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.consumer-fixtures.outputs.fixtures) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Build library
        run: pnpm -F @altalyst/hookify build

      - name: Run ${{ matrix.fixture }} fixture
        run: pnpm test:consumers ${{ matrix.fixture }}

  react-compat:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18.0.0", "18"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Install React ${{ matrix.react }}
        env:
          REACT_VERSION: ${{ matrix.react }}
        run: |
          TYPES="${REACT_VERSION%%.*}"
          # pnpm has no --no-save: this edits the library's package.json and
          # the lockfile in the CI checkout only, and is never committed.
          pnpm -F @altalyst/hookify add -D \
            "react@$REACT_VERSION" "react-dom@$REACT_VERSION" \
            "@types/react@$TYPES" "@types/react-dom@$TYPES"

      - name: Type-check
        run: pnpm typecheck

      - name: Run library tests
        run: pnpm test --run
        env:
          CI: true

  docs-check:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      # Hook page front matter, plus Markdown syntax that the docs site's
      # future.v4 flag would show as raw text (old-style admonition titles).
      - name: Check docs metadata and syntax
        run: pnpm docs:check

      # docs-site gets @altalyst/hookify as a workspace package, whose types
      # come from its dist/, so build the library before type-checking.
      - name: Build library
        run: pnpm build

      - name: Type-check docs
        run: pnpm -F docs-site typecheck

      - name: Build docs site
        run: pnpm docs:build
