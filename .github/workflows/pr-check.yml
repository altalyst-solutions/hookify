name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-check:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Check formatting
        run: npm run format:check

      - name: Lint library
        run: npm run lint

      - name: Run library tests
        run: npm run test
        env:
          CI: true

      - name: Build library
        run: npm run build

  react-compat:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18.0.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Install React ${{ matrix.react }}
        run: |
          TYPES="${{ matrix.react }}"
          TYPES="${TYPES%%.*}"
          npm install --no-save \
            react@${{ matrix.react }} react-dom@${{ matrix.react }} \
            @types/react@$TYPES @types/react-dom@$TYPES

      - name: Type-check
        run: npx tsc -b

      - name: Run library tests
        run: npm run test -- --run
        env:
          CI: true

  docs-check:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node and install dependencies
        uses: ./.github/actions/setup-deps

      - name: Cache docs node_modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            docs-site/node_modules
          key: ${{ runner.os }}-docs-node-${{ hashFiles('docs-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-docs-node-

      - name: Install docs dependencies
        run: cd docs-site && npm ci

      - name: Build docs site
        run: npm run docs:build
