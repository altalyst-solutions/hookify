name: Publish to MCP Registry

# Lists @altalyst/hookify-mcp on the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.altalyst-solutions/hookify,
# from packages/hookify-mcp/server.json.
#
# Triggers:
# - workflow_call from ci.yml, right after a release publishes
#   @altalyst/hookify-mcp to npm.
# - workflow_dispatch: manual run, for example to list the current version
#   for the first time or to retry a failed listing.
#
# The registry checks that the npm package version in server.json exists and
# that its package.json `mcpName` equals the server name, and authenticates
# this workflow with GitHub OIDC: no secret is needed.

on:
  workflow_call:
  workflow_dispatch:

permissions: {} # deny-all default; the job grants only what it needs

jobs:
  publish:
    if: ${{ github.repository == 'altalyst-solutions/hookify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the MCP Registry authenticates GitHub Actions with OIDC
    env:
      # Upgrade deliberately; the binary's Sigstore signature is verified below.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        working-directory: packages/hookify-mcp
        run: ../../mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        working-directory: packages/hookify-mcp
        run: ../../mcp-publisher publish
