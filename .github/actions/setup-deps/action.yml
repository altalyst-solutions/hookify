name: Set up Node and install dependencies
description: Sets up pnpm (version from the packageManager field) and Node from .nvmrc, restores the pnpm store cache, and runs a frozen pnpm install. Requires the repository to be checked out first.

inputs:
  registry-url:
    description: npm registry URL to configure (needed for publishing)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Must run before setup-node, whose pnpm cache needs pnpm on the PATH.
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: ".nvmrc"
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
        # One store cache for the library and docs-site lockfiles.
        cache-dependency-path: |
          pnpm-lock.yaml
          docs-site/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
