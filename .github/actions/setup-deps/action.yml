name: Set up Node and install dependencies
description: Sets up Node from .nvmrc, restores the npm/node_modules cache, and runs npm ci. Requires the repository to be checked out first.

inputs:
  registry-url:
    description: npm registry URL to configure (needed for publishing)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: ".nvmrc"
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false

    - name: Cache node_modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      shell: bash
      run: npm ci
